<style>
  html,body{margin:0;height:100%;}
  body{
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  @keyframes cupFall{
    0%   {transform:translateY(-158%) rotate(-12deg) scale(1);opacity:1}
    5%   {transform:translateY(-96%)  rotate(-6deg)  scale(1)}
    9%   {transform:translateY(-34%)  rotate(-1deg)  scale(1)}
    11.5%{transform:translateY(0%)    rotate(2deg)   scaleX(1.14) scaleY(0.8)}
    14%  {transform:translateY(0%)    rotate(0deg)   scaleX(0.92) scaleY(1.09)}
    16.5%{transform:translateY(0%)    scaleX(1.05) scaleY(0.96)}
    19%  {transform:translateY(0%)    scale(1)}
    53%  {transform:translateY(0%)    scale(1)}
    56%  {transform:translateY(0%)    scaleX(1.045) scaleY(0.965)}
    59%  {transform:translateY(0%)    scale(1)}
    78%  {transform:translateY(0%)    scale(1);opacity:1}
    90%  {transform:translateY(-7%)   scale(1.03);opacity:0}
    100% {transform:translateY(-7%)   scale(1.03);opacity:0}
  }
  @keyframes contentsFlutter{
    0%   {transform:translateY(-178%) translateX(0) rotate(calc(-6deg*var(--wind)));opacity:1}
    13%  {transform:translateY(-166%) translateX(calc(-5%*var(--wind)))  rotate(calc(-10deg*var(--wind)))}
    20%  {transform:translateY(-126%) translateX(calc(9%*var(--wind)))   rotate(calc(10deg*var(--wind)))}
    27%  {transform:translateY(-93%)  translateX(calc(-9%*var(--wind)))  rotate(calc(-10deg*var(--wind)))}
    34%  {transform:translateY(-63%)  translateX(calc(9%*var(--wind)))   rotate(calc(9deg*var(--wind)))}
    41%  {transform:translateY(-37%)  translateX(calc(-7%*var(--wind)))  rotate(calc(-7deg*var(--wind)))}
    47%  {transform:translateY(-16%)  translateX(calc(5%*var(--wind)))   rotate(calc(5deg*var(--wind)))}
    52%  {transform:translateY(-3%)   translateX(calc(-2%*var(--wind)))  rotate(calc(-2deg*var(--wind)))}
    55%  {transform:translateY(0%)    translateX(0) rotate(0deg)}
    57%  {transform:translateY(-2%)   translateX(0) rotate(1.5deg)}
    60%  {transform:translateY(0%)    translateX(0) rotate(0deg)}
    78%  {transform:translateY(0%)    translateX(0) rotate(0deg);opacity:1}
    90%  {transform:translateY(-7%)   translateX(0) rotate(0deg);opacity:0}
    100% {transform:translateY(-7%)   translateX(0) rotate(0deg);opacity:0}
  }
  @keyframes landShadow{
    0%   {transform:translateX(-50%) scale(0.32);opacity:0.10}
    9%   {transform:translateX(-50%) scale(0.60);opacity:0.16}
    11.5%{transform:translateX(-50%) scale(1.28);opacity:0.30}
    14%  {transform:translateX(-50%) scale(0.92);opacity:0.22}
    19%  {transform:translateX(-50%) scale(1.06);opacity:0.26}
    22%  {transform:translateX(-50%) scale(1.0);opacity:0.25}
    56%  {transform:translateX(-50%) scale(1.07);opacity:0.27}
    60%  {transform:translateX(-50%) scale(1.0);opacity:0.25}
    78%  {transform:translateX(-50%) scale(1.0);opacity:0.25}
    90%  {transform:translateX(-50%) scale(0.88);opacity:0}
    100% {transform:translateX(-50%) scale(0.88);opacity:0}
  }
</style>
