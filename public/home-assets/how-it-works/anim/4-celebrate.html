<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>



<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  @keyframes hop-x{
    0%   {transform:translateX(-200px)}
    50%  {transform:translateX(200px)}
    100% {transform:translateX(-200px)}
  }
  @keyframes hop-y{
    0%   {transform:translateY(0)}
    18%  {transform:translateY(-225px)}
    32%  {transform:translateY(-225px)}
    50%  {transform:translateY(0)}
    68%  {transform:translateY(-225px)}
    82%  {transform:translateY(-225px)}
    100% {transform:translateY(0)}
  }
  @keyframes tilt{
    0%   {transform:rotate(-13deg)}
    25%  {transform:rotate(13deg)}
    50%  {transform:rotate(13deg)}
    75%  {transform:rotate(-13deg)}
    100% {transform:rotate(-13deg)}
  }
  @keyframes squash{
    0%   {transform:scale(1.18,0.82)}
    14%  {transform:scale(0.9,1.14)}
    30%  {transform:scale(1,1)}
    44%  {transform:scale(0.96,1.06)}
    50%  {transform:scale(1.18,0.82)}
    64%  {transform:scale(0.9,1.14)}
    80%  {transform:scale(1,1)}
    94%  {transform:scale(0.96,1.06)}
    100% {transform:scale(1.18,0.82)}
  }
  @keyframes shadow-x{
    0%   {transform:translateX(-200px)}
    50%  {transform:translateX(200px)}
    100% {transform:translateX(-200px)}
  }
  @keyframes shadow-pulse{
    0%   {transform:scale(1.1);opacity:.34}
    18%  {transform:scale(0.5);opacity:.12}
    32%  {transform:scale(0.5);opacity:.12}
    50%  {transform:scale(1.1);opacity:.34}
    68%  {transform:scale(0.5);opacity:.12}
    82%  {transform:scale(0.5);opacity:.12}
    100% {transform:scale(1.1);opacity:.34}
  }
  @keyframes pop-left{
    0%,100%{transform:scale(0.2);opacity:0}
    4%{transform:scale(1.15);opacity:1}
    16%{transform:scale(1.35);opacity:0}
  }
  @keyframes pop-right{
    0%,46%,100%{transform:scale(0.2);opacity:0}
    54%{transform:scale(1.15);opacity:1}
    66%{transform:scale(1.35);opacity:0}
  }
  @keyframes float-dot{
    0%,100%{transform:translateY(0);opacity:.5}
    50%{transform:translateY(-16px);opacity:1}
  }
  @keyframes twinkle{
    0%,100%{transform:scale(0.7) rotate(0deg);opacity:.35}
    50%{transform:scale(1.15) rotate(45deg);opacity:1}
  }
  @keyframes apex-mark{
    0%,100%{transform:translateY(8px) scale(0.4);opacity:0}
    10%{transform:translateY(-6px) scale(1);opacity:1}
    22%{transform:translateY(-22px) scale(1.1);opacity:0}
    50%{transform:translateY(8px) scale(0.4);opacity:0}
    60%{transform:translateY(-6px) scale(1);opacity:1}
    72%{transform:translateY(-22px) scale(1.1);opacity:0}
  }
</style>

<div style="position:absolute;inset:0;overflow:hidden;font-family:'Nunito','Segoe UI',sans-serif">

  <div style="position:absolute;left:14%;top:22%;width:10px;height:10px;border-radius:50%;background:#b8c6ef;animation:float-dot 3.875s ease-in-out infinite"></div>
  <div style="position:absolute;left:82%;top:30%;width:8px;height:8px;border-radius:50%;background:#c9d4f2;animation:float-dot 4.5s ease-in-out 0.5s infinite"></div>
  <div style="position:absolute;left:74%;top:64%;width:11px;height:11px;border-radius:50%;background:#b8c6ef;animation:float-dot 3.5s ease-in-out 1.125s infinite"></div>
  <div style="position:absolute;left:20%;top:68%;width:7px;height:7px;border-radius:50%;background:#c9d4f2;animation:float-dot 4.125s ease-in-out 0.25s infinite"></div>
  <div style="position:absolute;left:50%;top:14%;width:9px;height:9px;border-radius:50%;background:#cdb6e8;animation:float-dot 4.875s ease-in-out 1.375s infinite"></div>

  <div style="position:absolute;left:11%;top:18%;width:26px;height:26px;color:#a9b7e8;animation:twinkle 5s ease-in-out infinite">✦</div>
  <div style="position:absolute;left:86%;top:50%;width:22px;height:22px;color:#d3a9e0;font-size:22px;animation:twinkle 4.25s ease-in-out 0.75s infinite">✦</div>
  <div style="position:absolute;left:30%;top:12%;width:18px;height:18px;color:#a9b7e8;font-size:18px;animation:twinkle 5.5s ease-in-out 1.75s infinite">✦</div>

  <!-- stage: center anchor -->
  <div style="position:absolute;left:50%;top:50%;width:0;height:0">

    <!-- ground shadow -->
    <div style="position:absolute;left:-200px;top:240px;width:400px;height:0;animation:shadow-x 2s cubic-bezier(.45,0,.55,1) infinite">
      <div style="position:absolute;left:50%;top:0;width:260px;height:54px;margin-left:-130px;border-radius:50%;background:radial-gradient(closest-side,#6f7cc0 0%,rgba(111,124,192,0) 78%);animation:shadow-pulse 1s cubic-bezier(.5,0,.5,1) infinite"></div>
    </div>

    <!-- landing sparkle bursts -->
    <div style="position:absolute;left:-200px;top:226px;font-size:40px;color:#ec9fc4;margin-left:-14px;animation:pop-left 2s linear infinite">✺</div>
    <div style="position:absolute;left:200px;top:226px;font-size:40px;color:#8e9be0;margin-left:-14px;animation:pop-right 2s linear infinite">✺</div>

    <!-- horizontal travel -->
    <div style="position:absolute;left:0;top:0;animation:hop-x 2s cubic-bezier(.45,0,.55,1) infinite">
