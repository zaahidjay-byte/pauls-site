<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  @keyframes penClick {
    0%   { transform: translate(0,0) rotate(0deg); }
    14%  { transform: translate(0,0) rotate(0deg); animation-timing-function: cubic-bezier(.35,0,.2,1); }
    29%  { transform: translate(9.4%, -9.7%) rotate(-5deg); animation-timing-function: cubic-bezier(.8,0,.25,1); }
    41%  { transform: translate(-12%, 12.3%) rotate(4deg); animation-timing-function: cubic-bezier(.3,.6,.4,1); }
    47%  { transform: translate(-9%, 9.2%) rotate(2.4deg); }
    57%  { transform: translate(0,0) rotate(0deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }
  @keyframes ahaPop {
    0%, 38% { transform: scale(1,1) rotate(0deg); }
    41%     { transform: scale(1.05,0.95) rotate(0deg); }
    45%     { transform: scale(0.965,1.05) rotate(-1.3deg); }
    50%     { transform: scale(1.025,0.99) rotate(0.8deg); }
    55%     { transform: scale(0.996,1.004) rotate(-0.3deg); }
    60%, 100% { transform: scale(1,1) rotate(0deg); }
  }
  @keyframes ahaGlow {
    0%, 37% { opacity: 0; transform: translate(-50%,-50%) scale(.4); }
    41%     { opacity: .85; transform: translate(-50%,-50%) scale(.7); }
    50%     { opacity: .4; transform: translate(-50%,-50%) scale(1.2); }
    60%     { opacity: 0; transform: translate(-50%,-50%) scale(1.65); }
    100%    { opacity: 0; transform: translate(-50%,-50%) scale(1.65); }
  }
  @keyframes twinkle {
    0%, 38% { opacity: 0; transform: translate(-50%,-50%) scale(0) rotate(0deg); }
    44%     { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(25deg); }
    54%     { opacity: 0; transform: translate(-50%,-50%) scale(.35) rotate(50deg); }
    100%    { opacity: 0; transform: translate(-50%,-50%) scale(.35) rotate(50deg); }
  }
  @keyframes floatBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-1.1%); }
  }
</style>
