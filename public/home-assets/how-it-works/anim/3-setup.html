<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- "We Show Up" tuk-tuk animation. Plain HTML/CSS rebuild of the earlier bundled
     page (same keyframes and timings: Normal speed, Heavy smoke, transparent
     background) without its React runtime, CDN scripts or self re-fetch. -->
<style>
  html, body { height: 100%; margin: 0; }
  @keyframes drivein {
    0%   { transform: translateX(118%) rotate(1.5deg); }
    62%  { transform: translateX(-3%) rotate(-1deg); }
    80%  { transform: translateX(1.5%) rotate(.5deg); }
    100% { transform: translateX(0) rotate(0deg); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  @keyframes puff {
    0%   { transform: translate(0,0) scale(.3); opacity: 0; }
    18%  { opacity: var(--op); }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.6); opacity: 0; }
  }
  @keyframes shadowpulse {
    0%, 100% { transform: translateX(-50%) scaleX(1);   opacity: .2; }
    50%      { transform: translateX(-50%) scaleX(.9);  opacity: .13; }
  }
  .scene { min-height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; background: transparent; overflow: hidden; box-sizing: border-box; }
  .stage { position: relative; width: clamp(340px,47vw,600px); aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; }
  .drive { width: 100%; height: 100%; animation: drivein 2.25s cubic-bezier(.16,.84,.36,1) both; }
  .bobber { position: relative; width: 100%; height: 100%; animation: bob 2.125s ease-in-out infinite; animation-delay: 1.5s; }
  .shadow { position: absolute; left: 50%; bottom: 9%; width: 62%; height: 26px; background: radial-gradient(ellipse at center, rgba(40,50,110,.45), rgba(40,50,110,0) 70%); border-radius: 50%; transform: translateX(-50%); animation: shadowpulse 2.125s ease-in-out infinite; animation-delay: 1.5s; z-index: 0; }
  .puff { position: absolute; border-radius: 50%; pointer-events: none; z-index: 1; background: radial-gradient(circle at 50% 45%, rgba(224,231,246,.96), rgba(189,201,229,.55) 55%, rgba(189,201,229,0) 73%); }
  .puff.stop { z-index: 3; background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.98), rgba(255,255,255,.7) 50%, rgba(255,255,255,0) 72%); }
  .tuktuk { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>

<script>
(function () {
  var driveDur = 2.25;                 // "Normal" speed
  var cfg = { n: 8, op: 0.72 };        // "Heavy" smoke
  var wheels = [{ left: 23, top: 80 }, { left: 70, top: 78 }];
  var bobber = document.getElementById('bobber');
  var img = bobber.querySelector('.tuktuk');

  function addPuff(cls, s) {
    var d = document.createElement('div');
    d.className = cls;
    d.style.left = s.left; d.style.top = s.top;
    d.style.width = s.size + 'px'; d.style.height = s.size + 'px';
    d.style.setProperty('--dx', s.dx + 'px');
    d.style.setProperty('--dy', s.dy + 'px');
    d.style.setProperty('--op', s.op);
    d.style.animation = s.animation;
    bobber.insertBefore(d, img);
  }

  // exhaust puffs, looping
  wheels.forEach(function (w, wi) {
    for (var k = 0; k < cfg.n; k++) {
      var f = cfg.n > 1 ? k / (cfg.n - 1) : 0;
      var dur = 1.5 + (k % 4) * 0.275;
      addPuff('puff', {
        left: (w.left + (k % 2 ? 1.5 : -1.5)) + '%', top: w.top + '%',
        size: 26 + (k % 3) * 11,
        dx: 55 + f * 80 + wi * 12,
        dy: -(28 + f * 34 + (k % 2) * 10),
        op: cfg.op,
        animation: 'puff ' + dur + 's ease-out ' + (0.1875 + k * (dur / cfg.n)) + 's infinite'
      });
    }
  });

  // one-shot white smoke burst when the tuk-tuk stops
  var stopAt = driveDur * 0.78;
  wheels.forEach(function (w, wi) {
    var burst = 7;
    for (var k = 0; k < burst; k++) {
      var ang = Math.PI * (0.15 + 0.7 * (k / (burst - 1)));
      var dist = 70 + (k % 3) * 28;
      addPuff('puff stop', {
        left: w.left + '%', top: (w.top + 2) + '%',
        size: 36 + (k % 3) * 16,
        dx: -Math.cos(ang) * dist + (wi ? 18 : -18),
        dy: -Math.abs(Math.sin(ang)) * dist - 14,
        op: 0.92,
        animation: 'puff ' + (1.0625 + (k % 3) * 0.225) + 's ease-out ' + (stopAt + (k % 2) * 0.075) + 's 1 both'
      });
    }
  });

  // replay the drive-in every (drive + 1.125s), restarting every animation in it
  setInterval(function () {
    var old = document.getElementById('drive');
    old.parentNode.replaceChild(old.cloneNode(true), old);
  }, (driveDur + 1.125) * 1000);
})();
</script>
